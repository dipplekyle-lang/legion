<script type="module">
// "The Fly", 30 s, built from the whole SPEC.md (section numbers in comments). Same rig and passes as test 6, with Part 20 colour.
import * as THREE from 'three';
import { mergeVertices } from './addons/utils/BufferGeometryUtils.js';
const FONTS = [['Lilita', 'LilitaOne.ttf'], ['Lucky', 'LuckiestGuy-Regular.ttf'], ['Fredoka', 'Fredoka.ttf'], ['Marker', 'Chewy.ttf'], ['Osd', 'Staatliches.ttf']];
await Promise.all(FONTS.map(([n, f]) => new FontFace(n, `url(./fonts/${f})`).load().then(ff => document.fonts.add(ff))));
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(66, W / H, 0.02, 40);     // wide lens close to the subject (111, 116)
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- helpers ----------
// 186: render targets hold raw values and the last copy shows them as they are, so an ink given as an sRGB hex comes out
// far too dark (#4C3B40 showed as #110B0C). Inks (lines, face parts, limbs, effects) are given in display values with disp().
const disp = (hex) => { const n = parseInt(hex.slice(1), 16); return new THREE.Color().setRGB((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255, THREE.LinearSRGBColorSpace); };
const CHAR_LINE = disp('#322530');                                   // 176: his line core #2E202A (p25 #261A22), dark plum, R > B > G
const TINT = new THREE.Color(1, 1, 1);                               // the scene light's tint on the heads (94, 107), set per look
const lam = (c, x = {}) => new THREE.MeshLambertMaterial({ color: c, ...x });
const ONE = { value: 1 };
function hullMat(width, color, vary = 0, lk = ONE, pull = 0, low = 0.35) {   // vary: hand-drawn line, thicker low and at the sides, never even (143, 176)
  return new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { w: { value: width }, c: { value: new THREE.Color(color) }, vary: { value: vary }, lk, pull: { value: pull }, low: { value: low } },
    vertexShader: `uniform float w, vary, lk, pull, low; void main(){ vec3 n = normalize(normal);
      float k = 1.0 + vary * (0.2 * sin(dot(position, vec3(41.0, 29.0, 17.0))) * sin(dot(position, vec3(-13.0, 37.0, 23.0))) + 0.22 * sin(dot(position, vec3(9.0, 5.0, 3.0)) + 1.3) + low * pow(max(0.0, -n.y), 1.5) + 0.18 * abs(n.x));   // 176: his left and right lines differ (share 0.62)
      vec4 mv = modelViewMatrix * vec4(position + n * w * k * lk, 1.0); gl_Position = projectionMatrix * mv;
      if (pull > 0.0) { float p = pull * smoothstep(0.35, 0.8, -n.y); vec4 q = projectionMatrix * vec4(mv.xyz * (1.0 - p / length(mv.xyz)), 1.0); gl_Position.z = q.z / q.w * gl_Position.w; } }`,
    fragmentShader: 'uniform vec3 c; void main(){ gl_FragColor = vec4(c, 1.0); }' });
}
function outline(mesh, width, color = CHAR_LINE, vary = 0, lk = ONE, pull = 0, low = 0.35) {   // 63, 92, 176: inverted hull
  const src = mesh.geometry.clone(); if (src.attributes.uv) src.deleteAttribute('uv'); if (src.attributes.n0) src.deleteAttribute('n0'); src.deleteAttribute('normal');
  const g = mergeVertices(src, 1e-4); g.computeVertexNormals();
  const s = mesh.scale, k = (s.x + s.y + s.z) / 3;
  const o = new THREE.Mesh(g, hullMat(width / k, color, vary, lk, pull, low)); o.userData.hull = true; mesh.add(o); return o;
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.userData.canvas = c; return t; }
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function add(geo, col, o = {}, parent = scene) {
  const m = new THREE.Mesh(geo, o.mat || lam(o.map ? '#ffffff' : col, { ...(o.map ? { map: o.map } : {}), ...(o.side ? { side: o.side } : {}) }));
  parent.add(m); if (o.hull) outline(m, o.hull, o.line || CHAR_LINE); return m;
}
const blobTex = canvasTex(128, 128, (g) => { const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(30,20,40,0.5)'); gr.addColorStop(1, 'rgba(30,20,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); });
function blob(parent, x, y, z, sx, sz, op = 1) { const m = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: op })); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.userData.hull = true; parent.add(m); return m; }
function plane(w, h, tex, parent = scene, basic = false) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), basic ? new THREE.MeshBasicMaterial({ map: tex }) : lam('#ffffff', { map: tex })); parent.add(m); return m; }
function rings(g, x, y, r, cols = ['#E5302A', '#FFFFFF'], n = 4) { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.beginPath(); g.arc(x, y, r * (1 - i / n), 0, 7); g.fill(); } }
function txt(g, s, x, y, font, fill, align = 'center', stroke = null, sw = 0) { g.font = font; g.textAlign = align; g.textBaseline = 'middle'; if (stroke) { g.lineJoin = 'round'; g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(s, x, y); } g.fillStyle = fill; g.fillText(s, x, y); }
function drawFly(g, cx, cy, s, prog = 1) {                           // the hero prop: a fly in the real "urinal fly" convention, one clean icon
  g.save(); if (prog < 1) { g.beginPath(); g.rect(cx - s, cy - s, 2 * s * prog, 2 * s); g.clip(); }
  g.strokeStyle = '#141018'; g.lineCap = 'round'; g.lineWidth = s * 0.05;
  for (const sd of [-1, 1]) for (const k of [-1, 0, 1]) { g.beginPath(); g.moveTo(cx + sd * s * 0.12, cy + k * s * 0.14); g.quadraticCurveTo(cx + sd * s * 0.42, cy + k * s * 0.18 - s * 0.05, cx + sd * s * 0.5, cy + k * s * 0.3 + s * 0.08); g.stroke(); }
  g.lineWidth = s * 0.035; g.fillStyle = 'rgba(205,215,235,0.92)';
  for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(cx + sd * s * 0.26, cy + s * 0.12, s * 0.17, s * 0.38, sd * 0.45, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = '#141018'; g.beginPath(); g.ellipse(cx, cy + s * 0.08, s * 0.16, s * 0.34, 0, 0, 7); g.fill();
  g.beginPath(); g.arc(cx, cy - s * 0.3, s * 0.15, 0, 7); g.fill();
  g.fillStyle = '#B3262A'; for (const sd of [-1, 1]) { g.beginPath(); g.arc(cx + sd * s * 0.09, cy - s * 0.33, s * 0.065, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.ellipse(cx - s * 0.05, cy - s * 0.02, s * 0.035, s * 0.09, 0, 0, 7); g.fill();
  g.restore();
}

// hand-made graphics (145): wobbly marker lines, hatching, paper with grain; nothing perfectly geometric
function wob(g, pts, closed, amp, seed) { const r = rng(seed); g.beginPath(); pts.forEach(([x, y], i) => { const jx = (r() - 0.5) * amp, jy = (r() - 0.5) * amp; i ? g.lineTo(x + jx, y + jy) : g.moveTo(x + jx, y + jy); }); if (closed) g.closePath(); }
function wobLine(g, x0, y0, x1, y1, amp, seed) { const pts = []; for (let i = 0; i <= 8; i++) pts.push([x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8]); wob(g, pts, false, amp, seed); }
function wobRect(g, x, y, w, h, amp, seed) { const pts = [], n = 8; for (let i = 0; i < n; i++) pts.push([x + w * i / n, y]); for (let i = 0; i < n; i++) pts.push([x + w, y + h * i / n]); for (let i = 0; i < n; i++) pts.push([x + w - w * i / n, y + h]); for (let i = 0; i < n; i++) pts.push([x, y + h - h * i / n]); wob(g, pts, true, amp, seed); }
function wobEll(g, cx, cy, rx, ry, amp, seed, turns = 1) { const pts = [], n = Math.round(44 * turns); for (let i = 0; i <= n; i++) { const a = i / 44 * Math.PI * 2 - 0.4; const k = 1 + 0.04 * Math.sin(i * 0.7); pts.push([cx + rx * k * Math.cos(a), cy + ry * k * Math.sin(a)]); } wob(g, pts, turns === 1, amp, seed); }
function marker(g, col, lw) { g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; }
function hatch(g, x, y, w, h, col, step, seed) { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); marker(g, col, step * 0.75); const r = rng(seed); for (let k = -h; k < w; k += step) { g.beginPath(); g.moveTo(x + k + (r() - 0.5) * 6, y + h); g.lineTo(x + k + h + (r() - 0.5) * 6, y); g.stroke(); } g.restore(); }
function paper(g, w, h, grid, tint = '#F7F3E9') { g.fillStyle = tint; g.fillRect(0, 0, w, h); const r = rng(w * 7 + h); for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(120,100,70,${0.035 * r()})`; g.fillRect(r() * w, r() * h, 2 + r() * 3, 2 + r() * 3); }
  if (grid) { g.strokeStyle = 'rgba(80,130,205,0.2)'; g.lineWidth = 2; for (let y = grid; y < h; y += grid) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } for (let x = grid; x < w; x += grid) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); } }
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(110,80,40,0.14)'); g.fillStyle = vg; g.fillRect(0, 0, w, h); }
function sticker(g, s, x, y, size, fill, line, font = 'Lilita') { txt(g, s, x, y, `${size}px ${font}`, fill, 'center', line, size * 0.16); }
// 172, 173.1: every surface over ~5 % of the frame carries a fine pattern at the 1-3 px scale (flecks, grain, seams, dots)
function specks(g, w, h, n, cols, s0, s1, seed, where = null) { const r = rng(seed); for (let i = 0; i < n; i++) { const x = r() * w, y = r() * h, c = cols[Math.floor(r() * cols.length)], s = s0 + (s1 - s0) * r(), k = 0.6 + 0.8 * r(); if (where && !where(x, y)) continue; g.fillStyle = c; g.fillRect(x, y, s, s * k); } }
function grain(g, w, h, n, cols, seed, amp = 10, lw = [1.2, 3]) { const r = rng(seed); for (let i = 0; i < n; i++) { const y0 = r() * h, ph = r() * 6, f = 0.004 + 0.01 * r(); g.strokeStyle = cols[Math.floor(r() * cols.length)]; g.lineWidth = lw[0] + (lw[1] - lw[0]) * r(); g.beginPath(); const x0 = r() * w * 0.6, x1 = x0 + w * (0.3 + 0.7 * r()); for (let x = x0; x <= x1; x += 16) { const y = y0 + amp * Math.sin(x * f + ph) + 0.4 * amp * Math.sin(x * f * 3.1 + ph * 2); x === x0 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); } }
function panelTex(base, dark, light, w = 256, h = 1024, kick = true) { return canvasTex(w, h, (g) => { g.fillStyle = base; g.fillRect(0, 0, w, h); specks(g, w, h, 900, [dark, light], 1, 3, w + h);
  g.lineJoin = 'round'; for (const [x, y, ww, hh] of kick ? [[0.14, 0.06, 0.72, 0.38], [0.14, 0.5, 0.72, 0.3]] : [[0.1, 0.06, 0.8, 0.88]]) { g.strokeStyle = dark; g.lineWidth = 7; g.strokeRect(x * w, y * h, ww * w, hh * h); g.strokeStyle = light; g.lineWidth = 3; g.strokeRect(x * w + 6, y * h + 6, ww * w - 12, hh * h - 12); }
  if (kick) { g.fillStyle = '#B9BEC8'; g.fillRect(0, h * 0.86, w, h * 0.14); g.fillStyle = '#7E8490'; for (const x of [0.08, 0.36, 0.64, 0.92]) for (const y of [0.88, 0.98]) { g.beginPath(); g.arc(x * w, y * h, 4, 0, 7); g.fill(); } g.fillStyle = '#5A606C'; g.fillRect(0, h * 0.86, w, 4); }
  const r = rng(w * 3 + h); marker(g, 'rgba(20,25,60,0.35)', 3); for (let i = 0; i < 14; i++) { const x = r() * w, y = h * (0.7 + 0.16 * r()); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 14, y - 6, x + 30 + 20 * r(), y + 2); g.stroke(); } }); }

// ================= SET 1: the airport restroom (origin) =================
// Built as far as the camera looks (42): the urinal wall (name wall), the door wall, floor, ceiling.
const WALL_Z = -0.7, CEIL = 2.1, DOOR_X = 1.4;
// floor: teal / white checker without grout (71), a pattern that shows perspective (110.3)
const checkTex = canvasTex(512, 512, (g, w, h) => { const r = rng(3); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? '#1A97A6' : '#EEF0EE'; g.fillRect(x * 64, y * 64, 64, 64); g.fillStyle = `rgba(${r() < 0.5 ? '255,255,255' : '40,30,20'},${0.06 * r()})`; g.fillRect(x * 64, y * 64, 64, 64); }
  for (let i = 0; i < 26; i++) { g.strokeStyle = `rgba(60,45,30,${0.05 + 0.08 * r()})`; g.lineWidth = 1 + 3 * r(); g.beginPath(); const x0 = r() * w, y0 = r() * h; g.moveTo(x0, y0); g.quadraticCurveTo(x0 + 30 * r(), y0 + 20 * r(), x0 + 60 * (r() - 0.5), y0 + 40 * (r() - 0.5)); g.stroke(); }
  const odd = (x, y) => (Math.floor(x / 64) + Math.floor(y / 64)) % 2 === 1;      // 173.1: confetti flecks, light on teal, dark on white
  specks(g, w, h, 5200, ['#A3B9BD', '#7FA2AE', '#C2CFD2'], 1, 3, 31, (x, y) => !odd(x, y)); specks(g, w, h, 5200, ['#0C6C78', '#5DC3CF', '#2AAFBE'], 1, 3, 37, odd); });
checkTex.wrapS = checkTex.wrapT = THREE.RepeatWrapping; checkTex.repeat.set(2, 2);
const floor = plane(3.2, 3.2, checkTex); floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 0.9);
// walls: mint tiles (the one mid-chroma field, 135.2) with darker-base joints (72.3), a cobalt trim band, pale paint above
const tileTex = (wm, hm) => canvasTex(1024, Math.round(1024 * hm / wm), (g, w, h) => {
  const px = w / wm, band = h - 1.30 * px; g.fillStyle = '#E8EEEA'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#46C29C'; g.fillRect(0, band, w, h - band);
  const tp = 0.11 * px; { const r = rng(Math.round(wm * 100)); for (let y = h; y > band; y -= tp) for (let x = 0; x < w; x += tp) { g.fillStyle = r() < 0.5 ? `rgba(255,255,255,${0.06 * r()})` : `rgba(10,60,40,${0.07 * r()})`; g.fillRect(x, y - tp, tp, tp); }
    const st = g.createLinearGradient(0, h, 0, h - 0.25 * px); st.addColorStop(0, 'rgba(70,60,30,0.22)'); st.addColorStop(1, 'rgba(70,60,30,0)'); g.fillStyle = st; g.fillRect(0, h - 0.25 * px, w, 0.25 * px); }
  g.strokeStyle = '#2F9C7C'; g.lineWidth = 3;
  for (let x = 0; x <= w; x += tp) { g.beginPath(); g.moveTo(x, band); g.lineTo(x, h); g.stroke(); }
  for (let y = h; y >= band; y -= tp) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.fillStyle = '#235BDF'; g.fillRect(0, band - 0.045 * px, w, 0.045 * px);
  specks(g, w, band - 0.045 * px, Math.round(w * band / 110), ['#C6D0CB', '#D3DCD7', '#FFFFFF'], 1.5, 3.5, Math.round(wm * 70));   // 173.1: stipple on the paint, flecks on the tiles
  g.save(); g.translate(0, band); specks(g, w, h - band, Math.round(w * (h - band) / 160), ['#2FA583', '#6FD8B6'], 1, 2.5, Math.round(wm * 90)); g.restore();
  const r = rng(5); for (let i = 0; i < 40; i++) { const x = r() * w, y = r() * band, rr = 30 + r() * 90; const m = g.createRadialGradient(x, y, 0, x, y, rr); m.addColorStop(0, 'rgba(120,130,120,0.03)'); m.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = m; g.fillRect(x - rr, y - rr, 2 * rr, 2 * rr); } });
const backWall = plane(3.2, CEIL, tileTex(3.2, CEIL)); backWall.position.set(0, CEIL / 2, WALL_Z);
const leftWall = plane(3.0, CEIL, tileTex(3.0, CEIL)); leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-1.45, CEIL / 2, 0.8);
const DZ0 = -0.16, DZ1 = 0.56, DH = 1.5;                               // door opening on the right wall (character ~2/3 of a door, 73)
{ const a = plane(DZ0 - WALL_Z, CEIL, tileTex(DZ0 - WALL_Z, CEIL)); a.rotation.y = -Math.PI / 2; a.position.set(DOOR_X, CEIL / 2, (WALL_Z + DZ0) / 2);
  const b = plane(2.4 - DZ1, CEIL, tileTex(2.4 - DZ1, CEIL)); b.rotation.y = -Math.PI / 2; b.position.set(DOOR_X, CEIL / 2, (DZ1 + 2.4) / 2);
  const topT = canvasTex(256, 128, (g, w, h) => { g.fillStyle = '#E8EEEA'; g.fillRect(0, 0, w, h); });
  const c = plane(DZ1 - DZ0, CEIL - DH, topT); c.rotation.y = -Math.PI / 2; c.position.set(DOOR_X, (CEIL + DH) / 2, (DZ0 + DZ1) / 2); }
// door frame + the door itself (cobalt, our own sign: "GENTS" pictogram + the airport's rings logo = the motif, 56)
for (const [w, h, y, z] of [[0.03, DH + 0.03, DH / 2, DZ0 - 0.015], [0.03, DH + 0.03, DH / 2, DZ1 + 0.015], [DZ1 - DZ0 + 0.06, 0.03, DH + 0.015, (DZ0 + DZ1) / 2]]) {
  const f = add(new THREE.BoxGeometry(0.05, h, w), '#173E9E'); f.position.set(DOOR_X - 0.01, y, z); if (w > 0.1) f.scale.set(1, 1, 1); if (w > 0.1) { f.geometry.dispose(); f.geometry = new THREE.BoxGeometry(0.05, h, w); } }
const doorPivot = new THREE.Group(); doorPivot.position.set(DOOR_X, 0, DZ0); scene.add(doorPivot);
const doorSign = canvasTex(256, 384, (g, w, h) => { g.fillStyle = '#F4F4F2'; g.beginPath(); g.roundRect(8, 8, w - 16, h - 16, 24); g.fill(); g.fillStyle = '#1D2340';
  g.beginPath(); g.arc(w / 2, 92, 30, 0, 7); g.fill(); g.beginPath(); g.roundRect(w / 2 - 38, 130, 76, 110, 18); g.fill(); g.fillRect(w / 2 - 34, 230, 26, 70); g.fillRect(w / 2 + 8, 230, 26, 70);
  txt(g, 'GENTS', w / 2, 334, '48px Lilita', '#1D2340'); });
const door = add(new THREE.BoxGeometry(0.035, DH, DZ1 - DZ0 - 0.01), '#235BDF', { map: panelTex('#235BDF', '#163E9E', '#5C86F0') }, doorPivot); door.position.set(0, DH / 2, (DZ1 - DZ0) / 2);
{ const s = plane(0.16, 0.24, doorSign, doorPivot); s.rotation.y = -Math.PI / 2; s.position.set(-0.019, 1.05, (DZ1 - DZ0) / 2);
  const p = add(new THREE.BoxGeometry(0.01, 0.2, 0.06), '#C9CED6', {}, doorPivot); p.position.set(-0.022, 0.78, (DZ1 - DZ0) - 0.1); }
// the concourse behind the door (seen when it opens): a strip, built only as far as the camera looks (42)
function concourseTex(night) { return canvasTex(1024, 640, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * 0.55); sky.addColorStop(0, night ? '#08258E' : '#3B91D9'); sky.addColorStop(1, night ? '#2B3ECC' : '#8FD0FF'); g.fillStyle = sky; g.fillRect(0, 0, w, h * 0.55);
  if (night) { const r = rng(9); g.fillStyle = '#DCE4FF'; for (let i = 0; i < 40; i++) g.fillRect(r() * w, r() * h * 0.5, 3, 3); }
  else { g.fillStyle = '#FFFFFF'; g.beginPath(); g.ellipse(700, 120, 150, 24, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(700, 116); g.lineTo(650, 60); g.lineTo(685, 60); g.lineTo(745, 112); g.fill(); g.fillStyle = '#E5302A'; g.fillRect(820, 100, 16, 18); }
  g.fillStyle = night ? '#1C2150' : '#5B6475'; for (let x = 0; x < w; x += 128) g.fillRect(x, 0, 12, h * 0.55);
  g.fillStyle = night ? '#3A3F78' : '#E9E6EE'; g.fillRect(0, h * 0.55, w, h * 0.45); g.fillStyle = night ? 'rgba(255,255,255,0.05)' : 'rgba(80,70,110,0.08)'; for (let x = 0; x < w; x += 96) g.fillRect(x, h * 0.55, 4, h * 0.45);
  // departures board
  g.fillStyle = '#1D2340'; g.fillRect(560, 210, 380, 190); g.fillStyle = '#FFD21F'; txt(g, 'DEPARTURES', 750, 236, '30px Lilita', '#FFD21F');
